# Updates are grouped per ecosystem (Go majors open separate PRs) and wait
# 7 days after a release (cooldown) so compromised releases are usually
# yanked before they reach us. Security updates are not delayed.
version: 2
updates:
  - package-ecosystem: github-actions # also bumps the shared workflows
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
    cooldown: { default-days: 7 }

  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      go: { patterns: ["*"], update-types: [minor, patch] }
    cooldown: { default-days: 7 }
